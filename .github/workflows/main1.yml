name: macOS

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14

    steps:
      - name: Start macOS browser-controlled desktop
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " macOS information"
          echo "========================================"

          uname -m
          sw_vers
          whoami

          echo "========================================"
          echo " Installing Python"
          echo "========================================"

          python3 -m venv "$HOME/maccontrol-venv"
          source "$HOME/maccontrol-venv/bin/activate"

          python -m pip install --upgrade pip
          python -m pip install Flask pyobjc-framework-Quartz

          mkdir -p "$HOME/maccontrol"
          cd "$HOME/maccontrol"

          echo "========================================"
          echo " Creating server.py"
          echo "========================================"

          cat > server.py <<'PYTHON'
import os
import time
import threading
import subprocess
import secrets

from flask import Flask, request, Response
import Quartz

app = Flask(__name__)

TOKEN = os.environ.get("MACCONTROL_TOKEN", "")
SCREEN = "/tmp/maccontrol-screen.png"


def authorized():
    supplied = request.args.get("token", "")

    if not TOKEN:
        return False

    return secrets.compare_digest(supplied, TOKEN)


def screenshot_loop():
    while True:
        try:
            subprocess.run(
                ["/usr/sbin/screencapture", "-x", SCREEN],
                stdout=subprocess.DEVNULL,
                stderr=subprocess.DEVNULL,
                timeout=5,
            )
        except Exception as e:
            print(f"Screenshot error: {e}", flush=True)

        time.sleep(0.5)


def click_mouse(x, y):
    point = Quartz.CGPoint(
        float(x),
        float(y)
    )

    down = Quartz.CGEventCreateMouseEvent(
        None,
        Quartz.kCGEventLeftMouseDown,
        point,
        Quartz.kCGMouseButtonLeft,
    )

    up = Quartz.CGEventCreateMouseEvent(
        None,
        Quartz.kCGEventLeftMouseUp,
        point,
        Quartz.kCGMouseButtonLeft,
    )

    Quartz.CGEventPost(
        Quartz.kCGHIDEventTap,
        down
    )

    Quartz.CGEventPost(
        Quartz.kCGHIDEventTap,
        up
    )


def type_text(text):
    for char in text:
        event = Quartz.CGEventCreateKeyboardEvent(
            None,
            0,
            True,
        )

        Quartz.CGEventKeyboardSetUnicodeString(
            event,
            len(char),
            char,
        )

        Quartz.CGEventPost(
            Quartz.kCGHIDEventTap,
            event,
        )

        time.sleep(0.01)


@app.route("/")
def index():
    if not authorized():
        return "Unauthorized", 401

    return """
<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>macOS Control</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

#toolbar {
    height: 52px;
    background: #222;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    box-sizing: border-box;
}

#screen {
    display: block;
    max-width: 100vw;
    max-height: calc(100vh - 52px);
    margin: auto;
    cursor: crosshair;
    user-select: none;
}

input {
    background: #333;
    color: white;
    border: 1px solid #555;
    padding: 7px;
    width: 220px;
}

button {
    padding: 7px 12px;
}

#status {
    margin-left: 8px;
}
</style>
</head>

<body>

<div id="toolbar">
    <strong>macOS</strong>

    <input
        id="text"
        placeholder="Type text">

    <button onclick="sendText()">
        Type
    </button>

    <span id="status">
        Connecting...
    </span>
</div>

<img id="screen" draggable="false">

<script>
const token =
    new URLSearchParams(location.search).get("token");

const img =
    document.getElementById("screen");

const status =
    document.getElementById("status");


async function refresh() {
    try {
        const response = await fetch(
            "/screen?token=" +
            encodeURIComponent(token) +
            "&t=" +
            Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            status.textContent = "Error " + response.status;
            return;
        }

        const blob = await response.blob();

        const old = img.src;

        img.src = URL.createObjectURL(blob);

        if (old.startsWith("blob:")) {
            URL.revokeObjectURL(old);
        }

        status.textContent = "Connected";

    } catch (error) {
        status.textContent = "Disconnected";
    }
}


setInterval(refresh, 500);
refresh();


img.addEventListener("click", async function(event) {
    const rect = img.getBoundingClientRect();

    const x =
        (event.clientX - rect.left) *
        img.naturalWidth /
        rect.width;

    const y =
        (event.clientY - rect.top) *
        img.naturalHeight /
        rect.height;

    try {
        await fetch(
            "/click?token=" +
            encodeURIComponent(token),
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    x: x,
                    y: y
                })
            }
        );
    } catch (error) {
        status.textContent = "Click failed";
    }
});


async function sendText() {
    const input =
        document.getElementById("text");

    const text = input.value;

    if (!text) {
        return;
    }

    try {
        await fetch(
            "/type?token=" +
            encodeURIComponent(token),
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    text: text
                })
            }
        );

        input.value = "";

    } catch (error) {
        status.textContent = "Typing failed";
    }
}


document.addEventListener("keydown", async function(event) {
    if (event.target.tagName === "INPUT") {
        return;
    }

    event.preventDefault();

    try {
        await fetch(
            "/type?token=" +
            encodeURIComponent(token),
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    text: event.key
                })
            }
        );
    } catch (error) {
        status.textContent = "Keyboard failed";
    }
});
</script>

</body>
</html>
"""


@app.route("/screen")
def screen():
    if not authorized():
        return "Unauthorized", 401

    try:
        with open(SCREEN, "rb") as f:
            data = f.read()

        return Response(
            data,
            mimetype="image/png",
            headers={
                "Cache-Control": "no-store"
            },
        )

    except FileNotFoundError:
        return "No screenshot", 503


@app.route("/click", methods=["POST"])
def click_route():
    if not authorized():
        return "Unauthorized", 401

    data = request.get_json(force=True)

    click_mouse(
        data["x"],
        data["y"],
    )

    return "OK"


@app.route("/type", methods=["POST"])
def type_route():
    if not authorized():
        return "Unauthorized", 401

    data = request.get_json(force=True)

    type_text(
        data.get("text", "")
    )

    return "OK"


threading.Thread(
    target=screenshot_loop,
    daemon=True,
).start()


app.run(
    host="127.0.0.1",
    port=8080,
    debug=False,
    threaded=True,
)
PYTHON

          echo "========================================"
          echo " Checking server.py"
          echo "========================================"

          python -m py_compile server.py

          echo "Python syntax OK."

          echo "========================================"
          echo " Generating token"
          echo "========================================"

          TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"

          export MACCONTROL_TOKEN="$TOKEN"

          echo "Token generated."

          echo "========================================"
          echo " Starting Flask"
          echo "========================================"

          python server.py \
            > "$HOME/maccontrol/server.log" 2>&1 &

          SERVER_PID=$!

          sleep 5

          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Flask failed to start."
              echo
              cat "$HOME/maccontrol/server.log"
              exit 1
          fi

          echo "Flask started."

          echo "========================================"
          echo " Testing Flask"
          echo "========================================"

          STATUS="$(
            curl \
              -s \
              -o /tmp/maccontrol-test.html \
              -w "%{http_code}" \
              "http://127.0.0.1:8080/?token=${TOKEN}"
          )"

          echo "HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
              echo "Flask authentication test failed."
              cat "$HOME/maccontrol/server.log"
              exit 1
          fi

          echo "Flask is working."

          echo "========================================"
          echo " Testing screenshot"
          echo "========================================"

          /usr/sbin/screencapture \
            -x \
            "$SCREEN" \
            || true

          if [ -f "$SCREEN" ]; then
              echo "Screenshot file created."

              sips \
                -g pixelWidth \
                -g pixelHeight \
                "$SCREEN" \
                || true
          else
              echo "WARNING: screenshot file was not created."
              echo "This can happen when the GitHub runner has no GUI."
          fi

          echo "========================================"
          echo " Installing cloudflared"
          echo "========================================"

          mkdir -p "$HOME/cloudflared"

          curl \
            -L \
            --fail \
            --retry 3 \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz" \
            -o "$HOME/cloudflared.tgz"

          tar \
            -xzf \
            "$HOME/cloudflared.tgz" \
            -C "$HOME/cloudflared"

          chmod +x \
            "$HOME/cloudflared/cloudflared"

          echo "cloudflared version:"

          "$HOME/cloudflared/cloudflared" --version

          echo "========================================"
          echo " Starting Cloudflare tunnel"
          echo "========================================"

          "$HOME/cloudflared/cloudflared" \
            tunnel \
            --no-autoupdate \
            --url "http://127.0.0.1:8080" \
            > "$HOME/cloudflared.log" 2>&1 &

          TUNNEL_PID=$!

          echo "Cloudflare PID: $TUNNEL_PID"

          URL=""

          for i in $(seq 1 60); do

              if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
                  echo "cloudflared exited."

                  cat "$HOME/cloudflared.log"

                  exit 1
              fi

              URL="$(
                grep -Eo \
                  'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                  "$HOME/cloudflared.log" |
                head -1 ||
                true
              )"

              if [ -n "$URL" ]; then
                  break
              fi

              echo "Waiting for Cloudflare tunnel... ($i/60)"

              sleep 2

          done

          if [ -z "$URL" ]; then
              echo
              echo "Cloudflare URL was not found."
              echo
              echo "========== cloudflared.log =========="
              cat "$HOME/cloudflared.log"
              echo "======================================"
              exit 1
          fi

          echo
          echo "========================================"
          echo "          MAC DESKTOP URL"
          echo "========================================"
          echo
          echo "${URL}/?token=${TOKEN}"
          echo
          echo "========================================"
          echo " RUNNING"
          echo "========================================"
          echo

          while true; do

              if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                  echo "Flask stopped."
                  echo
                  cat "$HOME/maccontrol/server.log"
                  exit 1
              fi

              if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
                  echo "Cloudflare stopped."
                  echo
                  cat "$HOME/cloudflared.log"
                  exit 1
              fi

              sleep 10

          done
