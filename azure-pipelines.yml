pool:
  name: 'GitHub-hosted Agents'
  vmImage: 'macos-26-arm64-xl'

steps:
- checkout: none

- bash: |
    set -euo pipefail

    echo "========================================"
    echo " macOS information"
    echo "========================================"

    uname -m
    sw_vers
    whoami

    echo "========================================"
    echo " Installing Python packages"
    echo "========================================"

    python3 -m venv "$HOME/maccontrol-venv"
    source "$HOME/maccontrol-venv/bin/activate"

    python -m pip install --upgrade pip
    python -m pip install Flask pyobjc-framework-Quartz

    mkdir -p "$HOME/maccontrol"
    cd "$HOME/maccontrol"

    cat > server.py <<'PYTHON'
    import os
    import time
    import threading
    import secrets
    import subprocess

    from flask import Flask, request, Response
    import Quartz

    app = Flask(__name__)

    TOKEN = os.environ["CONTROL_TOKEN"]
    SCREEN = "/tmp/maccontrol-screen.png"

    def authorized():
        supplied = request.args.get("token", "")
        return (
            TOKEN and
            secrets.compare_digest(supplied, TOKEN)
        )

    def screenshot_loop():
        while True:
            try:
                subprocess.run(
                    ["/usr/sbin/screencapture", "-x", SCREEN],
                    stdout=subprocess.DEVNULL,
                    stderr=subprocess.DEVNULL,
                    timeout=5
                )
            except Exception:
                pass

            time.sleep(0.3)

    def click(x, y):
        point = Quartz.CGPoint(
            float(x),
            float(y)
        )

        down = Quartz.CGEventCreateMouseEvent(
            None,
            Quartz.kCGEventLeftMouseDown,
            point,
            Quartz.kCGMouseButtonLeft
        )

        up = Quartz.CGEventCreateMouseEvent(
            None,
            Quartz.kCGEventLeftMouseUp,
            point,
            Quartz.kCGMouseButtonLeft
        )

        Quartz.CGEventPost(
            Quartz.kCGHIDEventTap,
            down
        )

        Quartz.CGEventPost(
            Quartz.kCGHIDEventTap,
            up
        )

    def type_text(text):
        for char in text:
            event = Quartz.CGEventCreateKeyboardEvent(
                None,
                0,
                True
            )

            Quartz.CGEventKeyboardSetUnicodeString(
                event,
                1,
                char
            )

            Quartz.CGEventPost(
                Quartz.kCGHIDEventTap,
                event
            )

            time.sleep(0.005)

    @app.route("/")
    def index():
        if not authorized():
            return "Unauthorized", 401

        return """
        <!DOCTYPE html>
        <html>
        <head>
            <meta name="viewport"
                  content="width=device-width,initial-scale=1">

            <title>macOS Control</title>

            <style>
                html, body {
                    margin: 0;
                    padding: 0;
                    background: #111;
                    color: white;
                    font-family: Arial, sans-serif;
                }

                #bar {
                    height: 50px;
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    padding: 0 10px;
                    background: #222;
                }

                #screen {
                    display: block;
                    max-width: 100vw;
                    max-height: calc(100vh - 50px);
                    margin: auto;
                    cursor: crosshair;
                    user-select: none;
                }

                input {
                    background: #333;
                    color: white;
                    border: 1px solid #555;
                    padding: 7px;
                    width: 220px;
                }

                button {
                    padding: 7px 12px;
                }
            </style>
        </head>

        <body>
            <div id="bar">
                <b>macOS</b>

                <input id="text"
                       placeholder="Type text">

                <button onclick="sendText()">
                    Type
                </button>

                <span id="status">
                    Connecting...
                </span>
            </div>

            <img id="screen"
                 draggable="false">

            <script>
                const token =
                    new URLSearchParams(location.search)
                    .get("token") || "";

                const img =
                    document.getElementById("screen");

                const status =
                    document.getElementById("status");

                async function refresh() {
                    try {
                        const r = await fetch(
                            "/screen?token=" +
                            encodeURIComponent(token) +
                            "&t=" +
                            Date.now(),
                            { cache: "no-store" }
                        );

                        if (!r.ok) {
                            status.textContent = "Error";
                            return;
                        }

                        const blob = await r.blob();

                        const old = img.src;

                        img.src =
                            URL.createObjectURL(blob);

                        if (old.startsWith("blob:")) {
                            URL.revokeObjectURL(old);
                        }

                        status.textContent =
                            "Connected";

                    } catch (e) {
                        status.textContent =
                            "Disconnected";
                    }
                }

                setInterval(refresh, 300);
                refresh();

                img.addEventListener(
                    "click",
                    async function(event) {

                        const rect =
                            img.getBoundingClientRect();

                        const x =
                            (event.clientX - rect.left) *
                            img.naturalWidth /
                            rect.width;

                        const y =
                            (event.clientY - rect.top) *
                            img.naturalHeight /
                            rect.height;

                        await fetch(
                            "/click?token=" +
                            encodeURIComponent(token),
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },
                                body: JSON.stringify({
                                    x: x,
                                    y: y
                                })
                            }
                        );
                    }
                );

                async function sendText() {
                    const input =
                        document.getElementById("text");

                    const text = input.value;

                    if (!text) {
                        return;
                    }

                    await fetch(
                        "/type?token=" +
                        encodeURIComponent(token),
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body: JSON.stringify({
                                text: text
                            })
                        }
                    );

                    input.value = "";
                }

                document.addEventListener(
                    "keydown",
                    async function(event) {

                        if (
                            event.target.tagName ===
                            "INPUT"
                        ) {
                            return;
                        }

                        event.preventDefault();

                        await fetch(
                            "/type?token=" +
                            encodeURIComponent(token),
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },
                                body: JSON.stringify({
                                    text: event.key
                                })
                            }
                        );
                    }
                );
            </script>
        </body>
        </html>
        """

    @app.route("/screen")
    def screen():
        if not authorized():
            return "Unauthorized", 401

        try:
            with open(SCREEN, "rb") as f:
                data = f.read()

            return Response(
                data,
                mimetype="image/png",
                headers={
                    "Cache-Control":
                        "no-store"
                }
            )

        except FileNotFoundError:
            return "No screenshot", 503

    @app.route("/click", methods=["POST"])
    def click_route():
        if not authorized():
            return "Unauthorized", 401

        data = request.get_json()

        click(
            data["x"],
            data["y"]
        )

        return "OK"

    @app.route("/type", methods=["POST"])
    def type_route():
        if not authorized():
            return "Unauthorized", 401

        data = request.get_json()

        type_text(
            data.get("text", "")
        )

        return "OK"

    threading.Thread(
        target=screenshot_loop,
        daemon=True
    ).start()

    app.run(
        host="127.0.0.1",
        port=8080,
        threaded=True
    )
    PYTHON

    echo "========================================"
    echo " Checking Python"
    echo "========================================"

    python -m py_compile server.py

    echo "Python syntax OK."

    echo "========================================"
    echo " Generating token"
    echo "========================================"

    TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"

    export CONTROL_TOKEN="$TOKEN"

    echo "========================================"
    echo " Starting server"
    echo "========================================"

    python server.py \
      > "$HOME/maccontrol/server.log" 2>&1 &

    SERVER_PID=$!

    sleep 5

    if ! kill -0 "$SERVER_PID" 2>/dev/null; then
        echo "Server failed:"
        cat "$HOME/maccontrol/server.log"
        exit 1
    fi

    echo "Server started."

    echo "========================================"
    echo " Testing screenshot"
    echo "========================================"

    /usr/sbin/screencapture \
      -x \
      /tmp/test.png \
      || true

    if [ -f /tmp/test.png ]; then
        echo "Screenshot works."
        sips \
          -g pixelWidth \
          -g pixelHeight \
          /tmp/test.png
    else
        echo "WARNING: Screenshot unavailable."
    fi

    echo "========================================"
    echo " Installing ARM64 cloudflared"
    echo "========================================"

    mkdir -p "$HOME/cloudflared"

    curl -L \
      --fail \
      --retry 3 \
      https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz \
      -o "$HOME/cloudflared.tgz"

    tar -xzf \
      "$HOME/cloudflared.tgz" \
      -C "$HOME/cloudflared"

    chmod +x \
      "$HOME/cloudflared/cloudflared"

    echo "cloudflared:"
    file "$HOME/cloudflared/cloudflared"

    echo "========================================"
    echo " Starting Cloudflare tunnel"
    echo "========================================"

    "$HOME/cloudflared/cloudflared" \
      tunnel \
      --no-autoupdate \
      --url http://127.0.0.1:8080 \
      > "$HOME/cloudflared.log" 2>&1 &

    TUNNEL_PID=$!

    URL=""

    for i in $(seq 1 60); do
        URL="$(
            grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              "$HOME/cloudflared.log" |
            head -1 ||
            true
        )"

        if [ -n "$URL" ]; then
            break
        fi

        sleep 2
    done

    echo
    echo "========================================"
    echo "          MAC DESKTOP URL"
    echo "========================================"

    if [ -n "$URL" ]; then
        echo
        echo "${URL}/?token=${TOKEN}"
        echo
    else
        echo "Tunnel URL not found."
        echo
        cat "$HOME/cloudflared.log"
        exit 1
    fi

    echo "========================================"
    echo " RUNNING"
    echo "========================================"

    while true; do
        if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "Server stopped."
            cat "$HOME/maccontrol/server.log"
            exit 1
        fi

        if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
            echo "Tunnel stopped."
            cat "$HOME/cloudflared.log"
            exit 1
        fi

        sleep 10
    done

  displayName: 'Start browser-controlled macOS desktop'
  timeoutInMinutes: 55
